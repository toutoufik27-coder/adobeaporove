[project]
name = "kids-studio"
version = "0.1.0"
description = "Kiko & Friends: the production line for a kids' channel (bible, gates, writer agent, timing, lip sync, mixing, GPU scheduling)"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
# the writer through the paid API; the default backend is the `claude` CLI (subscription)
api = ["anthropic>=1.8"]
# model installation with the license check (Hugging Face model cards)
models = ["huggingface_hub>=0.24"]
# the training agent's pictures (poses, palette checks, contact sheets)
agent = ["pillow>=10"]
dev = ["pytest>=8", "pillow>=10", "numpy>=1.24"]

[project.scripts]
studio = "studio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
